global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    stack: exchange-core-lab

scrape_configs:
  - job_name: exchange-core-lab-app
    # Actuator is mounted at the root (see application.yml), so the metrics path is /prometheus.
    metrics_path: /prometheus
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: exchange-core-lab

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
