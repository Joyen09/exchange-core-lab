spring:
  application:
    name: exchange-core-lab
  datasource:
    # Defaults target the compose Postgres published on a non-default host port,
    # so running the app from an IDE works without extra configuration.
    url: jdbc:postgresql://localhost:55432/exchange_core_lab
    # The application connects as a non-superuser role so the revoked UPDATE/DELETE grants on
    # postings are an actual control rather than catalogue decoration (V3__application_role.sql).
    username: exchange_core_app
    password: local_dev_only
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations run as the owner: the application role cannot, and must not be able to, alter schema.
    user: exchange_core
    password: local_dev_only
  kafka:
    # Redpanda, published by compose on a non-default host port.
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The outbox must not mark a row published until the broker has actually replicated it;
      # anything weaker would turn "at least once" into "usually".
      acks: all
    consumer:
      group-id: exchange-core-lab.verifier
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

outbox:
  topic: exchange-core-lab.orders.v1
  poll-interval: 200ms
  batch-size: 100
  max-attempts: 10
  initial-backoff: 1s
  max-backoff: 5m
  send-timeout: 10s
  retention: 7d

idempotency:
  retention: 24h
  abandoned-after: 5m

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      # SPEC §4 Phase 0 requires `/health`. Actuator is mounted at the root and only three
      # endpoints are exposed; everything else (env, beans, heapdump, ...) stays unreachable.
      base-path: /
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: exchange-core-lab

exchange:
  # SPEC §1.4: these two values are checked against a hard-coded testnet allowlist during
  # environment preparation. A non-testnet value aborts startup; there is no override.
  rest-base-url: https://testnet.binance.vision
  ws-base-url: wss://stream.testnet.binance.vision:9443
  connect-timeout: 3s
  read-timeout: 10s

logging:
  level:
    root: INFO
    io.github.joyen09.exchangecore: DEBUG
